name: IAM Security Gate (M6)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# The workflow only reads the repository, so the token gets read-only access.
permissions:
  contents: read

jobs:
  iam-security-gate:
    name: IAM Policy Security Check & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy values so boto3 never picks up real credentials in CI.
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest --cov=src

      - name: Ensure there is something to scan
        shell: bash
        run: |
          test -d policies || { echo "::error::policies/ directory is missing"; exit 1; }
          count=$(find policies -type f \( -name '*.json' -o -name '*.tf' -o -name '*.yaml' -o -name '*.yml' \) | wc -l)
          echo "Policy files to scan: $count"
          test "$count" -gt 0

      - name: Gate self-test (must FAIL on an unsafe policy)
        shell: bash
        run: |
          set +e
          out=$(python -m src.cli ci-gate --path tests/fixtures/unsafe/ --fail-on HIGH 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::Gate passed an unsafe policy"
            exit 1
          fi
          # Match the short summary line, not a finding name: the results
          # table wraps long names across lines, which breaks grep.
          if ! echo "$out" | grep -q "CI SECURITY GATE FAILED"; then
            echo "::error::Gate exited non-zero but did not report a gate failure (possible crash)"
            exit 1
          fi

      - name: Run IAM CI/CD Security Gate
        run: python -m src.cli ci-gate --path policies/ --fail-on HIGH