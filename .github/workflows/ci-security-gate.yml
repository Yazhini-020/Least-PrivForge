name: IAM Security Gate (M6)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  iam-security-gate:
    name: IAM Policy Security Check & Unit Tests
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Run Unit Tests
        run: |
          python -m pytest --cov=src

      - name: Ensure there is something to scan
        shell: bash
        run: |
          count=$(find policies -type f \( -name '*.json' -o -name '*.tf' -o -name '*.yaml' -o -name '*.yml' \) | wc -l)
          echo "Policy files to scan: $count"
          test "$count" -gt 0

      - name: Gate self-test (must FAIL on an unsafe policy)
        shell: bash
        run: |
          set +e
          out=$(python -m src.cli ci-gate --path tests/fixtures/unsafe/ --fail-on HIGH 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "Gate passed an unsafe policy"
            exit 1
          fi
          if ! echo "$out" | grep -q "SERVICE_WILDCARD_WITH_WILDCARD_RESOURCE"; then
            echo "Gate failed, but not for the expected security finding"
            exit 1
          fi

      - name: Run IAM CI/CD Security Gate
        run: |
          python -m src.cli ci-gate --path policies/ --fail-on HIGH